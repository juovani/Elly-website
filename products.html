<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products — Elly Convenience</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="Elly Logo/favicon-32.png">
    <link rel="apple-touch-icon" href="Elly Logo/apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="brand">
                <img src="Elly Logo/elly-icon-eye-light.png" alt="" class="brand-logo">
                Elly Convenience
            </a>

            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="index.html#location">Visit Us</a>
            </div>
            
            <div class="nav-right">
                <button class="lang-toggle" id="langToggle">AR</button>
                <button class="cart-toggle" id="cartToggle"><i class="fa-solid fa-cart-shopping"></i><span id="cartCount">0</span></button>
                <button class="menu-btn" id="menuBtn">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </nav>
    </header>

    <main class="wrap">
        <h1>What We Carry</h1>

        <h2>Egyptian Groceries</h2>
        <div class="product-grid" id="grid-groceries"></div>

        <h2>Snacks &amp; Sweets</h2>
        <div class="product-grid" id="grid-snacks"></div>

        <h2>Smoke Shop</h2>
        <div class="product-grid" id="grid-smoke"></div>
    </main>
    <footer>
        <div class="hours">
            <h3>Hours</h3>
            <p>Monday - Saturday: 8am - 10pm</p>
            <p>Sunday: 8am - 9pm</p>
        </div>
        <div class="contact">
            <h3>Call us</h3>
            <a href="tel:+17743405102" class="phone-link">(774) 340-5102</a>
        </div>
    </footer>
    <div class="cart-overlay" id="cartOverlay"></div>
    <aside class="cart-drawer" id="cartDrawer">
        <div class="cart-header" id="cartHeader">
            <h3>Your Cart</h3>
            <button class="close-cart" id="closeCart">&times;</button>
        </div>
        <div class="cart-body" id="cartBody"></div>
    </aside>
    <script src="products.js"></script>
    <script src="index.js"></script>
</body>
</html>
